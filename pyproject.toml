[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micas-ppt"
version = "0.1.0"
description = "Editable PowerPoint conversion using the registered Micas template"
requires-python = ">=3.10"
dependencies = ["python-pptx>=1.0.2,<2", "lxml>=4.9"]

[project.optional-dependencies]
desktop = ["tkinterdnd2==0.4.3"]
build = ["pyinstaller==6.16.0"]

[project.gui-scripts]
micas-converter = "micas_ppt.desktop:main"

[project.scripts]
micas-ppt = "micas_ppt.cli:main"

[tool.setuptools.packages.find]
include = ["micas_ppt*"]
